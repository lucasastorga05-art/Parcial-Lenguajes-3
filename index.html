<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Inscripción al Curso</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

	<div class="bg-primary text-white text-center py-4 mb-5">
		<span class="mb-0 text-white-50 small">2026</span>
		<h1 class="h3 fw-bold mb-1">Inscripción al Curso</h1>
		<p class="mb-0 text-white-50 small">Facultad de Ingeniería</p>
	</div>

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-12 col-md-7 col-lg-6">

				<div class="card shadow-sm mb-4">
					<div class="card-header bg-white border-bottom py-3">
						<h2 class="h5 text-primary fw-bold mb-1">Formulario de Inscripción</h2>
						<p class="text-muted small mb-0">Completá todos los campos para registrarte.</p>
					</div>
					<div class="card-body p-4">

						<div class="mb-3">
							<label for="nombre" class="form-label fw-semibold">Nombre y Apellido</label>
							<input
								type="text"
								id="nombre"
								class="form-control"
								placeholder="Ej: Juan García"
								autocomplete="off"
							/>
							<span id="error-nombre" class="small d-block mt-1"></span>
						</div>

						<div class="mb-3">
							<label for="dni" class="form-label fw-semibold">DNI</label>
							<input
								type="text"
								id="dni"
								class="form-control"
								placeholder="Ej: 38456789"
								maxlength="8"
								autocomplete="off"
							/>
							<span id="error-dni" class="small d-block mt-1"></span>
						</div>

						<div class="mb-3">
							<label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
							<input
								type="date"
								id="fechaNacimiento"
								class="form-control"
							/>
							<span id="error-fecha" class="small d-block mt-1"></span>
						</div>

						<div id="mensaje-exito" class="alert alert-success d-none" role="alert"></div>

						<div class="d-grid gap-2 d-sm-flex mt-4">
							<button type="button" class="btn btn-primary flex-fill" onclick="validarFormulario()">Enviar Inscripción
							</button>
							<button type="button" class="btn btn-outline-primary flex-fill" onclick="hacerPreguntas()">Preguntas Adicionales
							</button>
						</div>

					</div>
				</div>

				<div id="respuestas-container" class="card shadow-sm mb-5 d-none">
					<div class="card-header bg-white py-3">
						<h3 class="h6 text-primary fw-bold mb-0">Respuestas Adicionales</h3>
					</div>
					<div class="card-body p-3">
						<div id="respuestas-lista"></div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<footer class="text-center text-muted small py-3 border-top bg-white mt-auto">
		Ingeniería Informática · LUCAS ALBERTO ASTORGA BALBUENA
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
